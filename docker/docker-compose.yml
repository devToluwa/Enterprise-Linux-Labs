services:
  app01:
    build: ./app
    hostname: app01
    env_file: .env
    volumes:
      - ./html:/var/www/html
    restart: unless-stopped

  app02:
    build: ./app
    hostname: app02
    env_file: .env
    volumes:
      - ./html:/var/www/html
    restart: unless-stopped
  
  nginx:
    depends_on:
      - app01
      - app02
    image: nginx:latest
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    restart: unless-stopped  
  db01:
    image: mariadb:latest
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: PRODUCTION
      MYSQL_USER: labUser
      MYSQL_PASSWORD: 123456
    restart: unless-stopped
