- name: Install Apache
  hosts: app01
  become: yes
  
  tasks:
    - name: Install Apache
      dnf:
        name: httpd
        state: present

    - name: Start Apache service, and make it persistent
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Create 'index.html' file at web root directory
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Welcome to my..... wooooooorld\nrenewed expectations</h1>"
